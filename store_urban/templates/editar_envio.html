{% extends 'layout.html' %}
{% load static %}
{% block body %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario Envío</title>
    <link rel="stylesheet" href="{% static 'css/direccion_envio.css' %}">
</head>

<body>
    <div class="container py-5">
        <div class="form-container">
            <h2 class="text-center mb-4">📦 Información de Envío</h2>

            <form method="POST" novalidate>

                {% csrf_token %}
                <!-- Nombre -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="nombre" name="nombre" placeholder="Nombre"value="{{ direccion.nombre }}" required>
                        <label for="nombre">Nombre</label>
                    </div>
                    <i class="fas fa-user form-icon"></i>
                </div>
                <!-- Dirección -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="direccion" name="direccion" placeholder="Dirección" value = "{{ direccion.direccion }}">
                        <label for="direccion">Dirección</label>
                    </div>
                    <i class="fas fa-map-marker-alt form-icon"></i>
                </div>

                <!-- Ciudad -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="ciudad" name="ciudad" placeholder="Ciudad" value="{{ direccion.ciudad }}" required>
                        <label for="ciudad">Ciudad</label>
                    </div>
                    <i class="fas fa-city form-icon"></i>
                </div>

                <!-- Estado / Departamento -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="estado" name="departamento" placeholder="Departamento" value="{{ direccion.departamento }}" required>
                        <label for="estado">Departamento</label>
                    </div>
                    <i class="fas fa-building form-icon"></i>
                </div>

                <!-- Código Postal -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="codigo_postal" name="codigo_postal" placeholder="Código Postal" value="{{ direccion.codigo_postal }}">
                        <label for="codigo_postal">Código Postal</label>
                    </div>
                    <i class="fas fa-envelope-open form-icon"></i>
                </div>

                <!-- Teléfono -->
                <div class="position-relative">
                    <div class="form-floating">
                        <input type="text" class="form-control" id="telefono" name="telefono" placeholder="Teléfono" value="{{ direccion.telefono }}" required>
                        <label for="telefono">Teléfono</label>
                    </div>
                    <i class="fas fa-phone form-icon"></i>
                </div>

                <div class="mb-3">
                    <label for="tipo_envio" class="form-label">Tipo de Envío:</label>
                    <select name="tipo_envio" id="tipo_envio" class="form-select" required>
                        {% for tipo in tipos_envio %}
                        <option  value="{{ tipo.id }}">{{ tipo.nombre }}</option>
                        
                        {% endfor %}
                    </select>
                </div>
            
                <button type="submit" class="btn btn-amarillo">
                    <i class="fas fa-save"></i> Guardar Cambios
                </button>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
{% endblock %}
